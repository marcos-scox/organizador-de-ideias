<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<title>Organizador de Ideias</title>
<meta name="description" content="Organize ideias com anotações, imagens, fluxogramas, workflows e checklists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/styles.css?v=1.4.3-settings1">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Lista de ideias">
    <div class="side-top">
      <button class="brand" data-act="about" aria-label="Abrir Sobre"><img src="assets/logo-lampada.png" alt=""><b>Organizador de Ideias<span>.</span></b></button>
      <button class="btn-new" id="newBtn"><span class="dot"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Nova ideia</button>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar ideias" aria-label="Buscar ideias"></label>
    </div>
    <div class="side-label">Recentes</div>
    <nav class="list" id="list"></nav>
    <div class="side-bottom"><button class="settings-link" id="settingsBtn" data-act="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-5 2v4"/></svg>Configurações</button><button class="about-link" data-act="about">Sobre o aplicativo</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status"><span id="toastText">Bloco removido</span><button id="toastUndo">Desfazer</button></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="backupPick" accept=".zip,application/zip" hidden>
<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <h2 id="mTitle">Apagar esta ideia?</h2>
    <p id="mText">A ideia e todos os blocos dela serão removidos. Isso não pode ser desfeito.</p>
    <div class="modal-actions">
      <button class="btn-sec" id="mCancel">Cancelar</button>
      <button class="btn-danger" id="mOk">Apagar</button>
    </div>
  </div>
</div>

<script src="assets/fflate.js"></script>
<script src="src/app.js?v=1.4.3-navfix1"></script>
</body>
</html>
